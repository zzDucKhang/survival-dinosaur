[package]
name = "dino-isle-native"
version = "0.2.0"
edition = "2021"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_scene",
    "bevy_state",
    "bevy_winit",
    "bevy_gltf",
    "bevy_animation",
    "bevy_ui",
    "bevy_text",
    "default_font",
    "png",
    "jpeg",
    "webp",
    "tonemapping_luts",
    "multi_threaded",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.24"
crossbeam-channel = "0.5"

[profile.dev]
opt-level = 1
debug = 0
incremental = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"